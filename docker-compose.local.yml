services:
  # Sentinel 求解服务：常驻 Chromium 执行网页 turnstile 挑战（网页生图必需）
  sentinel-solver:
    build:
      context: .
      dockerfile: docker/solver.Dockerfile
    container_name: chatgpt2api-solver-local
    restart: unless-stopped
    environment:
      SENTINEL_SOLVER_KEY: local-dev-solver-key
      SENTINEL_SOLVER_HOST: 0.0.0.0
      SENTINEL_SOLVER_PORT: "8788"
      SENTINEL_SOLVER_CHROME: /usr/bin/chromium
      SENTINEL_SOLVER_PROFILE_DIR: /tmp/solver-profile
      # 浏览器自身出网：留空直连；需要时填 http://host:port
      SENTINEL_SOLVER_PROXY: ${SENTINEL_SOLVER_PROXY:-}
    ports:
      - "127.0.0.1:8788:8788"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    depends_on:
      - sentinel-solver
    ports:
      - "8001:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: sqlite:////app/data/chatgpt2api.db
      CHATGPT2API_AUTH_KEY: 4486022
      CHATGPT2API_SENTINEL_SOLVER_ENABLED: "true"
      CHATGPT2API_SENTINEL_SOLVER_URL: http://sentinel-solver:8788
      CHATGPT2API_SENTINEL_SOLVER_KEY: local-dev-solver-key
    # 应用数据库；删除 DATABASE_URL 时同样默认使用 /app/data/chatgpt2api.db
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname

    # 认证密钥 (可选，覆盖 config.json)
    #   CHATGPT2API_AUTH_KEY: your_secret_key

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com
