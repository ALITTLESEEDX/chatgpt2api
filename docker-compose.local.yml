services:
  # Sentinel 求解服务：常驻 Chromium 在真实 chatgpt.com 页面里计算 Turnstile（文字与生图对话必需）
  sentinel-solver:
    build:
      context: ./sentinel_solver
    container_name: chatgpt2api-solver-local
    restart: unless-stopped
    environment:
      SENTINEL_SOLVER_KEY: local-dev-solver-key
      # 浏览器自身出网：留空直连；需要时填 http://host:port
      SENTINEL_SOLVER_PROXY: ${SENTINEL_SOLVER_PROXY:-}
      SENTINEL_SOLVER_TIMEZONE: ${SENTINEL_SOLVER_TIMEZONE:-Asia/Shanghai}
    volumes:
      - sentinel-solver-browsers:/ms-playwright
    ports:
      - "127.0.0.1:8080:8080"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    depends_on:
      - sentinel-solver
    ports:
      - "8001:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: sqlite:////app/data/chatgpt2api.db
      CHATGPT2API_AUTH_KEY: 4486022
      CHATGPT2API_SENTINEL_SOLVER_URL: http://sentinel-solver:8080
      CHATGPT2API_SENTINEL_SOLVER_KEY: local-dev-solver-key
    # 应用数据库；删除 DATABASE_URL 时同样默认使用 /app/data/chatgpt2api.db
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname

    # 认证密钥 (可选，覆盖 config.json)
    #   CHATGPT2API_AUTH_KEY: your_secret_key

    # 基础 URL (可选)
    #   CHATGPT2API_BASE_URL: https://your-domain.com

volumes:
  sentinel-solver-browsers:
