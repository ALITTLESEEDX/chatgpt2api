services:
  # Sentinel 求解服务：常驻 Chromium 在真实 chatgpt.com 页面里计算 Turnstile（文字与生图对话必需）
  # 只接收挑战参数（prepare 响应 + 令牌种子 p），不接收账号 token / Cookie / prompt
  sentinel-solver:
    # 默认拉取 CI 在 v* 标签上推送的镜像；本地改了 solver 代码时用 --build 重新构建
    image: ${SENTINEL_SOLVER_IMAGE:-ghcr.io/yukkcat/chatgpt2api-sentinel-solver:latest}
    build:
      context: ./sentinel_solver
    container_name: chatgpt2api-solver
    restart: unless-stopped
    environment:
      SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:?请在 .env 里设置 SENTINEL_SOLVER_KEY}
      # 浏览器自身出网：留空直连；需要时填 http://host:port，应与主服务访问 chatgpt.com 的出口一致
      SENTINEL_SOLVER_PROXY: ${SENTINEL_SOLVER_PROXY:-}
      # 页面时区，应与出口 IP 所在地一致
      SENTINEL_SOLVER_TIMEZONE: ${SENTINEL_SOLVER_TIMEZONE:-${TZ:-Asia/Shanghai}}
      # 容器启动时下载 Chromium 用的代理（可选）
      HTTPS_PROXY: ${SENTINEL_SOLVER_DOWNLOAD_PROXY:-}
      HTTP_PROXY: ${SENTINEL_SOLVER_DOWNLOAD_PROXY:-}
    volumes:
      # 持久化已下载的 Chromium，重建容器时不必重新下载
      - sentinel-solver-browsers:/ms-playwright
    expose:
      - "8080"
    # 只在本机调试时打开（默认不暴露到宿主机）
    # ports:
    #   - "127.0.0.1:8080:8080"

  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    depends_on:
      - sentinel-solver
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      # Sentinel 求解服务（容器内用服务名访问）
      CHATGPT2API_SENTINEL_SOLVER_URL: http://sentinel-solver:8080
      CHATGPT2API_SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:?请在 .env 里设置 SENTINEL_SOLVER_KEY}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  chatgpt2api-runtime:
  sentinel-solver-browsers:
